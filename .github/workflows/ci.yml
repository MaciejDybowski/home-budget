name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: budget_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: budget_integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U budget_test -d budget_integration"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://budget_test:test_only_password@localhost:5432/budget_integration
      TEST_DATABASE_URL: postgresql://budget_test:test_only_password@localhost:5432/budget_integration
    defaults:
      run:
        working-directory: budget-app-backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: budget-app-backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run db:deploy
      - run: npm run test:e2e -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: budget-app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check:i18n
      - run: npm run lint
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: budget-app/test-results/
          retention-days: 7

  docker-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sh scripts/test-distribution.sh
      - run: python3 scripts/test-installer.py
      - run: cmp LICENSE budget-app/LICENSE && cmp LICENSE budget-app-backend/LICENSE
