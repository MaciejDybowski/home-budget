name: Publish images and deployment bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v2026.11.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf '%s\n' 'Expected an existing version tag such as v2026.11.0.' >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\nowner=%s\n' "$TAG" "${TAG#v}" "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
      - id: commit
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  images:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image context
        id: context
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [ "$COMPONENT" = backend ]; then
            printf 'path=./budget-app-backend\n' >> "$GITHUB_OUTPUT"
          else
            printf 'path=./budget-app\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/home-budget-${{ matrix.component }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  public-images:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    steps:
      - name: Verify anonymous access and both architectures
        env:
          OWNER: ${{ needs.prepare.outputs.owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          for component in backend frontend; do
            image="ghcr.io/$OWNER/home-budget-$component:$VERSION"
            if ! docker manifest inspect "$image" > manifest.json; then
              printf '%s\n' 'Set both GHCR packages to Public, then rerun the failed jobs.' >&2
              exit 1
            fi
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' manifest.json
          done

  release:
    needs: [prepare, public-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Package deployment files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ needs.prepare.outputs.owner }}
        run: python3 scripts/package-release.py "$VERSION" "$RUNNER_TEMP/homebudget-release" "$OWNER"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "HomeBudget $TAG" --generate-notes
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/homebudget-release/homebudget-compose.tar.gz" "$RUNNER_TEMP/homebudget-release/install.sh" "$RUNNER_TEMP/homebudget-release/docker-compose.yml" "$RUNNER_TEMP/homebudget-release/env.example" "$RUNNER_TEMP/homebudget-release/LICENSE" --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
