# Generic authenticated Render deployment template.
services:
  - type: web
    name: homebudget-external
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: 'off'
    buildCommand: sh scripts/render-build.sh
    startCommand: sh scripts/render-start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_FRONTEND
        value: 'true'
      - key: AUTH_MODE
        value: local
      - key: AUTH_COOKIE_SECURE
        value: 'true'
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
