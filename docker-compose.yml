services:
  postgres:
    image: postgres:15-alpine
    container_name: budget-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh install.sh or set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-budgetdb}
    volumes:
      # Persistent database storage. Keep this directory when upgrading.
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/maciejdybowski/home-budget-backend:${HOMEBUDGET_VERSION:-2026.11.2}}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-budgetdb}?schema=public
    command: ["npm", "run", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  budget-app-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/maciejdybowski/home-budget-backend:${HOMEBUDGET_VERSION:-2026.11.2}}
    container_name: budget-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-budgetdb}?schema=public
      PORT: 3000
      AUTH_MODE: ${AUTH_MODE:-none}
      APP_ORIGIN: ${APP_ORIGIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  budget-app-frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/maciejdybowski/home-budget-frontend:${HOMEBUDGET_VERSION:-2026.11.2}}
    container_name: budget-frontend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3001}:80"
    depends_on:
      budget-app-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
